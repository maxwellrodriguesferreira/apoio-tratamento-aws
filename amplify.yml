version: 1
frontend:
  phases:
    build:
      commands:
        - if [ -n "$GEMINI_API_KEY" ]; then sed -i "s/GEMINI_API_KEY_PLACEHOLDER/$GEMINI_API_KEY/g" app-config.js; fi
  artifacts:
    baseDirectory: .
    files:
      - '**/*'
    exclude:
      - '.git/**/*'
      - 'README.md'
      - 'test.js'
  cache:
    paths: []
